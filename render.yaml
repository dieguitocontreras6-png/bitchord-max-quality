services:
  - type: web
    name: bitchord-max-quality
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SOURCES
        value: internetarchive,commons,jamendo
      - key: JAMENDO_CLIENT_ID
        sync: false
      - key: CONTACT_URL
        sync: false
      - key: ALLOW_DOWNLOADS
        value: "0"
